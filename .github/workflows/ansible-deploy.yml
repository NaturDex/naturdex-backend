name: Ansible Deploy

on:
  workflow_call:
    inputs:
      server_ip:
        description: 'The IP address to deploy to'
        required: true
        type: string
      deploy_tags:
        description: 'Ansible tags to run (e.g., "deploy" or "infra,deploy")'
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  run-ansible:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Ansible
        run: pip install ansible

      - name: Install requirements
        run: ansible-galaxy install -r infra/ansible/requirements.yml

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          
      - name: Execute Playbook
        working-directory: infra/ansible
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || github.token }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          NGINX_AUTH_STRING: ${{ secrets.NGINX_HTPASSWD }}
        run: |
          ansible-playbook \
            -i "${{ inputs.server_ip }}," \
            -u ubuntu \
            --ssh-extra-args="-o StrictHostKeyChecking=no" \
            --tags "${{ inputs.deploy_tags }}" \
            playbook.yml