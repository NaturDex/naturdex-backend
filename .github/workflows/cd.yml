name: CD

permissions:
  pull-requests: write

on:
  push:
    branches: [main]

jobs:
  terraform:
    runs-on: ubuntu-latest
    outputs:
      server_ip: ${{ steps.apply.outputs.server_ip }}
    
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Terraform fmt
        working-directory: infra/terraform
        id: fmt
        run: terraform fmt -check
        continue-on-error: true

      - name: Terraform init
        working-directory: infra/terraform
        id: init
        run: terraform init

      - name: Terraform apply
        working-directory: infra/terraform
        id: apply
        run: |
          terraform apply -auto-approve -var="ssh_public_key=${{ secrets.SSH_PUBLIC_KEY }}"
          echo "server_ip=$(terraform output -raw app_server_public_ip)" >> $GITHUB_OUTPUT

  ansible:
    needs: terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Ansible
        run: pip install ansible

      - name: Install requirements
        run: ansible-galaxy install -r infra/ansible/requirements.yml

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Run playbook
        run: |
          ansible-playbook \
            -i "${{ needs.terraform.outputs.server_ip }}," \
            -u ubuntu \
            --ssh-extra-args="-o StrictHostKeyChecking=no" \
            -e "db_user=${{ secrets.DB_USER }} db_password=${{ secrets.DB_PASSWORD }}" \
            infra/ansible/playbook.yml
