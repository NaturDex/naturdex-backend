name: CD

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'infra/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
  
    runs-on: ubuntu-latest 
  
    steps:
    - uses: actions/checkout@v6
    
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag ghcr.io/naturdex/naturdex-backend:latest

    - name: Push Docker image
      run: docker push ghcr.io/naturdex/naturdex-backend:latest

  deploy:
      needs: build
      uses: ./.github/workflows/ansible-deploy.yml
      with:
        server_ip: ${{ vars.APP_SERVER_IP }}
        deploy_tags: "deploy"
      secrets: inherit