events {}

http {
    server {
        listen 80;

        location /metrics {
            auth_basic "Metrics";
            auth_basic_user_file /etc/nginx/.htpasswd;
            proxy_pass http://api:5000/metrics;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://api:5000;
            proxy_set_header Host $host;
        }

        location /grafana/ {
            proxy_pass http://grafana:3000/;
            proxy_set_header Host $host;
        }

    }
}