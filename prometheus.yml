global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'naturdex-backend'

scrape_configs:
  # .NET API metrics (prometheus-net)
  - job_name: 'naturdex-api'
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s
    static_configs:
      - targets: ['api:5234']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
